# Packaging config for the Electron shell. See electron/main.js for how the
# server is started, and the README for what this does and doesn't give you.
appId: com.cockpit.board
productName: Cockpit
copyright: ""

directories:
  output: release
  buildResources: build

# Drafts, not live releases: the tag build produces the artefacts, you decide
# when they go out. Publishing the draft is also what makes electron-updater
# start offering the update to existing Windows installs.
publish:
  provider: github
  owner: Tinomuchenje
  repo: cockpit
  releaseType: draft

# node-pty is built on Node-API, so its shipped prebuild is ABI-stable across
# Node and Electron versions and loads as-is. Letting electron-builder rebuild
# it would invoke node-gyp and demand Visual Studio Build Tools, which is the
# exact dependency this project avoids elsewhere (see db.js on node:sqlite).
npmRebuild: false

# asar is off deliberately. Two things in here fight it: Next.js does a lot of
# filesystem work resolving .next at runtime, and node-pty shells out to real
# helper binaries (winpty-agent.exe, conpty.dll, OpenConsole.exe) that must
# exist as actual files on disk. Unpacking both back out of the archive leaves
# little left to archive, and a plain directory is far easier to diagnose.
asar: false

# Base list, used as-is by linux (no override below). electron-builder does
# NOT merge a platform's `files` with this list — `win:`/`mac:` each fully
# REPLACE it since they declare their own `files` (for the node-pty prebuild
# excludes, see there) — so each repeats this whole list rather than just
# adding an exclude. Keep all three in sync by hand if this list changes.
files:
  - electron/**/*
  - server.js
  - src/**/*
  - .next/**/*
  - public/**/*
  - next.config.ts
  - package.json
  - "!**/*.map"
  - "!src/**/*.tsbuildinfo"
  # The board is per-machine and lives in userData once packaged. Shipping a
  # development database inside the installer would hand every install a copy
  # of local project paths.
  - "!data/**/*"
  # Webpack's build cache, not a runtime asset. `next start` never reads it,
  # and it dwarfs the actual .next output it sits next to (tens of MB vs low
  # single digits).
  - "!.next/cache/**/*"

win:
  target:
    - nsis
  icon: build/icon.png
  # Full copy of the root `files` list above (electron-builder replaces,
  # not merges, on a platform override) plus one exclude: node-pty ships
  # prebuilt binaries for every OS/arch inside one package unconditionally
  # (unlike e.g. next's @next/swc, which npm only installs the matching
  # platform for), so left alone this installer drags along darwin's native
  # pty binaries for nothing. Not split by arch here because `target` above
  # doesn't pin one, so both win32-x64 and win32-arm64 prebuilds may be
  # needed — revisit if that ever gets pinned.
  files:
    - electron/**/*
    - server.js
    - src/**/*
    - .next/**/*
    - public/**/*
    - next.config.ts
    - package.json
    - "!**/*.map"
    - "!src/**/*.tsbuildinfo"
    - "!data/**/*"
    - "!.next/cache/**/*"
    - "!node_modules/node-pty/prebuilds/darwin-*/**"

nsis:
  oneClick: false
  perMachine: false          # Per-user install needs no admin prompt.
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Cockpit
  # Versionless, so the landing page can link straight at
  # releases/latest/download/Cockpit-Setup.exe instead of the releases page.
  artifactName: "${productName}-Setup.${ext}"

# UNVERIFIED. The non-Windows branch of spawnClaude() has never been run, and
# nobody has launched this target on real hardware. CI can produce a dmg; that
# is not the same as it working.
#
# It is also unsigned and unnotarised, so macOS quarantines the download and
# reports it as damaged until the user strips the attribute by hand, and
# electron-updater cannot update it at all (Squirrel.Mac requires a signature).
# Both are fixed by an Apple Developer account, not by config.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.png
  category: public.app-category.developer-tools
  # Same reasoning as nsis.artifactName: a stable, versionless name per arch.
  artifactName: "${productName}-${arch}.${ext}"
  # Full copy of the root `files` list (see the comment on `win:` above for
  # why this can't just add an exclude) minus node-pty's windows prebuilds —
  # a mac DMG has no use for winpty-agent.exe/conpty.dll/OpenConsole.exe.
  files:
    - electron/**/*
    - server.js
    - src/**/*
    - .next/**/*
    - public/**/*
    - next.config.ts
    - package.json
    - "!**/*.map"
    - "!src/**/*.tsbuildinfo"
    - "!data/**/*"
    - "!.next/cache/**/*"
    - "!node_modules/node-pty/prebuilds/win32-*/**"

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Development
  artifactName: "${productName}.${ext}"
